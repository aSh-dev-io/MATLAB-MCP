[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ganstage2"
version = "0.2.0"
description = "Stage 2 physics-informed degradation analysis for the GaN HEMT digital twin (Phase 2A)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "h5py>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
